services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: docverify
      # Set these in a .env file next to this compose file (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # LLM provider: "openai" (OpenAI-compatible / self-hosted Ollama) or "anthropic".
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://135.13.20.57:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5vl:32b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000" # exposes /docs and the API directly for debugging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
