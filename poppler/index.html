<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Processing WebSocket</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Upload File for Processing</h1>
        <input type="file" id="fileInput" accept=".pdf, image/*" />
        <button id="uploadButton">Upload and Process</button>
        <div id="status">
            <p>Status: <span id="statusMessage">Waiting for input...</span></p>
        </div>
        <div id="result">
            <h2>Processed Data:</h2>
            <pre id="output"></pre>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
